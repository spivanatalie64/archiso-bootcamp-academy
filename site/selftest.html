<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework self-test</title>
<link rel="stylesheet" href="assets/academy.css">
<style>
  .selftest-summary { padding: 24px 20px 60px; max-width: 720px; margin: 0 auto; }
  .selftest-summary ul { list-style: none; padding: 0; }

  .selftest-summary li.fail { color: var(--bad); font-weight: 600; }
</style>

<main class="shell">
  <h1>Framework self-test</h1>
