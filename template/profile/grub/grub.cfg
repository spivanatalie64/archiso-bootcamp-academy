# GRUB configuration for the Vesper image.
#
# The identifiers in percent signs are replaced by mkarchiso when the image is
# built:
#   %INSTALL_DIR%  — the install_dir from profiledef.sh
#   %ARCH%         — the target architecture
#   %ARCHISO_UUID% — the ISO 9660 volume id, used to find the medium at boot

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == "x86_64" ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == "i386" ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == "arm64" ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == "riscv64" ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == "loongarch64" ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=vesper
timeout=15
timeout_style=menu

# Menu entries

menuentry "Vesper Linux (%ARCH%, ${archiso_platform})" --class vesper --class gnu-linux --class gnu --class os --id 'vesper' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
